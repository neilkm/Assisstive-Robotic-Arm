; PlatformIO Project Configuration File

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Iinclude
    -I../Common/UART_Driver
    -DUART_RX_BUF_SIZE=128u
    -DUART_TX_BUF_SIZE=128u

[env:nucleo_f446re_jetson]
extends = env:nucleo_f446re
platform_packages =
    toolchain-gccarmnoneeabi@symlink://.pio/toolchain-gccarmnoneeabi
