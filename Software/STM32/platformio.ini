; PlatformIO Project Configuration File

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Iinclude

[env:nucleo_f446re_jetson]
extends = env:nucleo_f446re
platform_packages =
    toolchain-gccarmnoneeabi@symlink://.pio/toolchain-gccarmnoneeabi
